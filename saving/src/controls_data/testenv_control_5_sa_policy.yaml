# Control 5 — Non-privileged service accounts must not hold privileged IAM
#
# Service accounts marked privileged=false must only receive read-only-safe
# permissions. Privileged roles / write / admin / secrets / impersonation →
# finding C5-001.
#
# Marker source (Asset Inventory on the live SA):
#   - GCP labels (default on) — foundation YAML ``privileged: "false"`` usually
#     lands here
#   - Resource Manager tags / effective tags (default on)
#
# Permission denylist is the same definition as Control 1 (RO policy YAML +
# restricted permissions JSON). This file only configures which SAs are in
# scope.
#
# Override path: APP_CHECK_5_POLICY
# Override marker: APP_CHECK_5_TAG_KEY / APP_CHECK_5_TAG_VALUE
# Override match: APP_CHECK_5_MATCH_LABELS / APP_CHECK_5_MATCH_TAGS

tag_key: privileged
tag_value: "false"
match_labels: true
match_tags: true
